# ============================================================================
# 开发 / 本地调试叠加配置（APP_ENV=dev）
# ----------------------------------------------------------------------------
# 在 config.yaml 基础上覆盖。**仅用于本地 / 测试**：关闭鉴权、缩短轮询。
# 生产环境切勿使用 APP_ENV=dev。
# ============================================================================

auth:
  enabled: false             # 本地调试关闭鉴权，免 token

service:
  log_level: DEBUG

client:
  # 测试时缩短轮询，加速用例
  poll_max_times: 5
  poll_interval_sec: 0.5
