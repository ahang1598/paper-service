# ============================================================================
# 生产环境叠加配置（APP_ENV=prod，默认）
# ----------------------------------------------------------------------------
# 在 config.yaml 基础上覆盖。生产环境的强约束集中在此，便于审计。
# 密钥仍由环境变量注入，不在此填写。
# ============================================================================

service:
  log_level: INFO

auth:
  enabled: true              # 生产强制鉴权

client:
  # 生产可适度放大超时与重试，抗下游抖动
  connect_timeout_sec: 5
  read_timeout_sec: 30
  max_retries: 3
  retry_backoff_sec: 1.0
