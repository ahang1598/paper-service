# ============================================================================
# paper-service 基础配置（base，生产安全默认）
# ----------------------------------------------------------------------------
# - 本文件为所有环境的公共默认值，提交到版本库。
# - 环境差异由 config.<env>.yaml 叠加覆盖；APP_ENV 选择叠加文件（默认 prod）。
# - **密钥严禁写在此处**：doc_service.auth_key 与 auth.bearer_tokens 留空，
#   由环境变量 / .env 注入（DOC_SERVICE_AUTH_KEY / API_BEARER_TOKENS）。
# - 任何字段都可被环境变量覆盖（优先级：env > .env > 本文件）。
# ============================================================================

# ---- 本服务监听 ----
service:
  host: "0.0.0.0"
  port: 12135
  log_level: INFO

# ---- 对外鉴权（HTTP 与 WebSocket 共用）----
auth:
  enabled: true              # 生产必须为 true；本地调试用 config.dev.yaml 关闭
  bearer_tokens: []          # 密钥：环境变量 API_BEARER_TOKENS 注入（逗号分隔），切勿在此填真实值

# ---- 下游文档全文服务 ----
doc_service:
  scheme: http
  host: "10.34.236.1"
  port: 9983
  auth_key: ""               # 密钥：环境变量 DOC_SERVICE_AUTH_KEY 注入

# ---- 默认设备信息（请求下游时使用，可在请求级覆盖）----
default_device:
  app_version: "12.1.8.410"
  device_id: "pmq"
  device_model: "ALN-AL00"
  device_type: "phone"
  prd_pkg_name: "com.huawei.vassistant"

# ---- 下游客户端运行参数 ----
client:
  connect_timeout_sec: 5     # 建连超时（秒）
  read_timeout_sec: 30       # 读取超时（秒）
  max_retries: 3             # 网络异常最大重试次数
  retry_backoff_sec: 1.0     # 重试退避基数（秒，按 attempt 线性递增）
  poll_max_times: 30         # pending 最大轮询次数
  poll_interval_sec: 2.0     # pending 轮询间隔（秒）

# ---- 下游 doc_fulltext 接口 ----
doc_fulltext:
  url_path: "/copilot_for_docs/doc_fulltext"   # 下游接口路径，参与 HMAC 签名
  timestamp_tolerance_ms: 600000               # 服务端允许的时间戳误差（毫秒）

# ---- 下游 docid 搜索服务（/search）----
docid_search:
  url: "http://10.37.0.140:6107/search"        # 搜索服务完整 URL（path 参与签名）
  auth_key: ""                                 # 密钥：环境变量 DOCID_SEARCH_AUTH_KEY 注入，切勿在此填真实值

# ---- docid 论文数据处理 ----
paper_processing:
  chunk_target_tokens: 400
  chunk_max_tokens: 450
  chunk_overlap_tokens: 60
  chunk_schema_version: "v1"
  tokenizer_path: ""                           # 可选 tokenizer.json；为空使用确定性多语言兜底计数器

# ---- docid relevant reranker ----
reranker:
  provider: internal                            # internal / siliconflow
  top_k: 8                                      # 每篇论文 top-k 硬上限
  top_k_min: 5                                  # 动态 top-k 最小值（不足时取实际 chunk/合格结果数）
  top_k_ratio: 0.1                              # 实际 top-k 按 chunk 数动态取 ceil(10%)
  min_score: 0.2                                # 低于门槛不返回，不强制填满 top-k
  neighbor_window: 1                            # seed 同章节前后邻居数
  batch_size: 32
  max_concurrency: 3
  max_retries: 3
  retry_backoff_sec: 1.0
  siliconflow:
    url: "https://api.siliconflow.cn/v1/rerank"
    model: "BAAI/bge-reranker-v2-m3"
    api_key: ""                                 # 密钥：SILICONFLOW_API_KEY 注入
    timeout_sec: 60
  internal:
    url: "http://10.33.111.223:8080/service"
    app_id: "lf_test"
    sign_key: ""                                # 密钥：INTERNAL_RERANK_SIGN_KEY 注入
    bid: "gte_multilingual_reranker_base_torch"
    flow_id: "gte_multilingual_reranker_base_torch"
    uuid: "12344525"
    timeout_sec: 300

# ---- 其它 ----
request:
  id_prefix: "srv"           # 服务端自动生成 request_id 时的前缀

# ---- 调试日志开关（默认关；排查问题时在 yaml 或环境变量打开）----
debug:
  log_request: false              # 打印进入服务的请求入参（HTTP/WS 请求体）
  log_downstream_request: false   # 打印访问下游（全文获取）时的入参（url + body，不含鉴权头）
  log_downstream_response: false  # 打印下游出参（响应体）——单独开关，响应可能很大
  log_paper_processing: false     # 打印全文解析、章节/chunk、reranker 入出参与合并结果（包含论文内容）
