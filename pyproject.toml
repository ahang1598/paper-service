[project]
name = "paper-service"
version = "0.1.0"
description = "文档查询统一服务（HTTP + WebSocket），可对接 MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "paper-service" }]

# 运行期依赖（生产）
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "requests>=2.31.0",
]

# 可选依赖分组：测试（不进入生产安装）
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 仅打包 app 包；tests / 配置文件不打进 wheel
packages = ["app"]

# ---- pytest 配置（原 pytest.ini 迁移至此）----
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
