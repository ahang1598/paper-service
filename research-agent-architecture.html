<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研究子Agent · 技术架构总览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0f18; --sheet:#0f1826; --navy:#16202e;
    --gold:#f0b45c; --teal:#2dd4bf; --cyan:#6fc3ff; --green:#8fce9e;
    --slate:#a3b6cc; --coral:#e8836e;
    --ink:#eef3fa; --sub:#94a5ba; --faint:#71839d; --line:#263447;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse 80% 60% at 50% -10%, #121c2c 0%, transparent 60%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:44px 24px 32px; font-family:'Noto Sans SC',sans-serif;
  }
  .sheet{
    width:100%; max-width:1600px; border:1px solid #1d2938; border-radius:12px;
    overflow:hidden; background:var(--sheet);
    box-shadow:0 48px 90px -36px rgba(0,0,0,.75), 0 0 0 1px rgba(240,180,92,.04);
  }
  svg{display:block;width:100%;height:auto}
  .caption{
    margin-top:18px; font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;
    font-size:12px; letter-spacing:.14em; color:#5a6c84; text-align:center;
  }
  /* ---------- 动效 ---------- */
  .band{opacity:0; transform:translateY(14px); animation:rise .8s cubic-bezier(.16,.8,.3,1) forwards}
  .b1{animation-delay:.05s}.g1{animation-delay:.32s}.b2{animation-delay:.42s}
  .g2{animation-delay:.72s}.b3{animation-delay:.82s}.g3{animation-delay:1.12s}
  .b4{animation-delay:1.22s}.foot{animation-delay:1.45s}
  @keyframes rise{to{opacity:1; transform:none}}
  .flow{stroke-dasharray:7 7; animation:flow 1.1s linear infinite}
  .slowflow{stroke-dasharray:5 5; animation:flow 1.7s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-14}}
  .node .box{transition:stroke-width .25s ease, filter .25s ease}
  .node:hover .box{stroke-width:2.5; filter:drop-shadow(0 0 9px rgba(240,180,92,.35))}
  @media print{
    body{background:none;padding:0}
    .sheet{border:none;box-shadow:none;border-radius:0}
    .caption{display:none}
    .band{animation:none;opacity:1;transform:none}
  }
  /* ---------- 字型 ---------- */
  .t-cn{font-family:'Noto Sans SC',sans-serif}
  .t-mono{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace}
</style>
</head>
