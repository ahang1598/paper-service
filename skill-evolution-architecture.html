<style>
:root{
  --bg:#04070f;
  --text:#e9effc;
  --muted:#93a7cd;
  --dim:#5b6d95;
  --cyan:#3be0ff;
  --blue:#5a8dff;
  --violet:#a78bfa;
  --amber:#ffb454;
  --emerald:#3ddc97;
  --rose:#ff738f;
  --gold:#ffd166;
  --line:#20305a;
  --sans:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif;
  --mono:"Cascadia Code","JetBrains Mono","SF Mono",Consolas,"Liberation Mono","Microsoft YaHei",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:28px;
  background:
    radial-gradient(1200px 700px at 20% -10%, rgba(59,224,255,.07), transparent 60%),
    radial-gradient(1000px 800px at 110% 110%, rgba(167,139,250,.08), transparent 60%),
    var(--bg);
}
.wrap{width:min(1720px,100%)}
svg{width:100%;height:auto;display:block;border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px rgba(59,224,255,.08)}
text{font-family:var(--sans);fill:var(--text);user-select:none}
.mono{font-family:var(--mono)}
.h1{font-size:34px;font-weight:700;letter-spacing:1px;filter:drop-shadow(0 0 20px rgba(59,224,255,.35))}
.eyebrow{font-family:var(--mono);font-size:11px;fill:var(--cyan);letter-spacing:3.5px}
.sub{font-size:12.5px;fill:var(--muted)}
.leg{font-size:10.5px;fill:#c3d2ef}
.ft{font-family:var(--mono);font-size:9.5px;fill:var(--dim);letter-spacing:.5px}
.sec{font-family:var(--mono);font-size:11.5px;fill:#9fc6e8;letter-spacing:1px}
.sec-r{font-family:var(--mono);font-size:10px;fill:var(--amber)}
.nt{font-size:15.5px;font-weight:700;fill:#f2f6ff}
.nd{font-size:10.5px;fill:var(--muted)}
.nd4{font-size:10px;fill:var(--muted)}
.np{font-family:var(--mono);font-size:8.5px;fill:#56689b;letter-spacing:.2px}
.nno{font-family:var(--mono);font-size:11.5px;font-weight:700;fill:var(--cyan)}
.chip{font-family:var(--mono);font-size:9px;letter-spacing:.3px}
.bul{fill:var(--cyan);font-size:9px}
.pt{font-size:16px;font-weight:700}
.psm{font-family:var(--mono);font-size:9px;fill:var(--dim);letter-spacing:1.5px}
.pstep{font-size:13px;font-weight:700;fill:#eef3ff}
.pdesc{font-size:10.5px;fill:var(--muted)}
.pnote{font-family:var(--mono);font-size:10px}
.pcell{font-size:10.5px;fill:#cfe0f7}
.plab{font-size:9.5px;fill:var(--muted)}
.pcap{font-size:9.5px}
.bkt-n{font-size:13.5px;font-weight:700;fill:#f0f5ff}
.bkt-e{font-family:var(--mono);font-size:9px}
.bkt-d{font-size:10.5px;fill:var(--muted)}
.tag{font-family:var(--mono);font-size:9.5px}
.gate-t{font-size:14px;font-weight:700;fill:var(--gold)}
.gate-d{font-size:10.5px;fill:#d9e4f6}
.gate-f{font-family:var(--mono);font-size:9px;fill:var(--gold)}
.hub-e{font-family:var(--mono);font-size:9.5px;fill:#7fd8ef;letter-spacing:2.5px}
.hub-m{font-size:21px;font-weight:700;fill:#eaf6ff}
.hub-f{font-family:var(--mono);font-size:9px;fill:#6fb9d4;letter-spacing:1.5px}
.alab{font-family:var(--mono);font-size:10px;fill:var(--gold)}
.clab{font-family:var(--mono);font-size:9px}
.node .cardbox{transition:stroke .25s,filter .25s}
.node:hover .cardbox{stroke:var(--cyan);filter:drop-shadow(0 0 12px rgba(59,224,255,.4))}
.node:hover .nno{fill:#7ff0ff}
.bkt{transition:.25s}
.bkt:hover .cardbox{stroke:var(--c);filter:drop-shadow(0 0 10px rgba(120,200,255,.3))}
.flow{stroke-dasharray:8 7;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-30}}
.rot{animation:spin 70s linear infinite;transform-origin:800px 450px;transform-box:view-box}
.rot2{animation:spin 42s linear infinite reverse;transform-origin:800px 450px;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.25,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{transform-box:view-box}
</style>

  <path d="M24,46 V24 H46" fill="none" stroke="#ffd166" stroke-width="2"/>
  <path d="M1554,24 H1576 V46" fill="none" stroke="#ffd166" stroke-width="2"/>
  <path d="M1576,954 V976 H1554" fill="none" stroke="#ffd166" stroke-width="2"/>
  <path d="M46,976 H24 V954" fill="none" stroke="#ffd166" stroke-width="2"/>
  <path d="M796,24 h8 M796,976 h8 M24,496 v8 M1576,496 v8" stroke="#2a3c68" stroke-width="1.5"/>

  <text x="60" y="44" class="eyebrow">SKILL-OPT · SELF-EVOLUTION PIPELINE</text>

<script>
const NS='http://www.w3.org/2000/svg';
const SVG=document.getElementById('app');
const CX=800, CY=450, R=250;
const C={cyan:'#3be0ff',blue:'#5a8dff',violet:'#a78bfa',amber:'#ffb454',emerald:'#3ddc97',rose:'#ff738f',gold:'#ffd166',dim:'#5b6d95',line:'#24365e'};

function $(tag,attrs,parent){const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n}
function txt(parent,x,y,str,cls,anchor){const t=$('text',{x,y,...(cls?{class:cls}:{}),...(anchor?{'text-anchor':anchor}:{})},parent);t.textContent=str;return t}
function tw(s,px){let w=0;for(const ch of s){w+=/[\u2E80-\u9FFF\uF900-\uFAFF\uFF00-\uFFEF\u3000-\u303F①-⑩★▸✓✗]/.test(ch)?px:px*.62}return w}
function rectEdge(c,t,hw,hh){const dx=t.x-c.x,dy=t.y-c.y;const sx=dx?hw/Math.abs(dx):1e9,sy=dy?hh/Math.abs(dy):1e9;const s=Math.min(sx,sy);return{x:c.x+dx*s,y:c.y+dy*s}}
const g=(id,d)=>$(id,{d},null);

const NOTCHES=document.getElementById('notches');
for(let i=0;i<6;i++){const a=(-90+60*i)*Math.PI/180;
  $('line',{x1:CX+244*Math.cos(a),y1:CY+244*Math.sin(a),x2:CX+258*Math.cos(a),y2:CY+258*Math.sin(a),stroke:'#31456f','stroke-width':1.5},NOTCHES);
}

const nodes=[
 {no:'01',title:'标注冻结',chip:'人工+脚本',cc:C.amber,x:800,y:200,
  lines:['loss-spec 定义「什么算好」','datasets + gold 卷宗(T1/T2 深度点)','presearch 注入冻结 · 臂间复用保公平'],
  path:'loss-spec.md · dossiers/ · presearch/'},
 {no:'02',title:'基线批跑',chip:'脚本',cc:C.cyan,x:1017,y:325,
  lines:['run_eval.py 无头 Agent 批跑','≥ 2 reps 防单次判分噪声(±0.5)','轨迹 / 答案全量落盘 runs/'],
  path:'evolve/harness/run_eval.py'},
 {no:'03',title:'四工序判分',chip:'A脚本 B混合 CD·LLM',cc:C.violet,x:1017,y:575,
  lines:['A 提取 · 轨迹→结构化事实(纯脚本)','B 硬检 · 溯源/红线(脚本+matcher)','C 评分 · 对照卷宗 L1 六维+三态','D 归因 · 仅失败样本·断点+五桶(LLM)'],
  path:'evolve/grader/ · A→B→C→D',dense:true},
 {no:'04',title:'聚合与梯度',chip:'脚本',cc:C.cyan,x:800,y:700,
  lines:['aggregate.py → scorecard / 梯度报告','rep-gate:≥2 reps 同向才 confirmed','失败簇 + 五桶 + 2×2 象限读数'],
  path:'evolve/grader/aggregate.py'},
 {no:'05',title:'定向编辑',chip:'人工',cc:C.amber,x:583,y:575,
  lines:['每次编辑必须带可证伪预期','E-id 局部编辑 / S-id 结构算子','止血修失败 · 造血补缺腿'],
  path:'skill-variants/ · capability-inventory'},
 {no:'06',title:'盲评验收',chip:'LLM+人工',cc:C.amber,x:583,y:325,
  lines:['validate 集成对盲评(甲乙匿名)','换位双判压 position bias','显著优 ∧ 无新增 S0 才接受'],
  path:'prompts/pairwise · human-eval/'}
];

const FLOWS=document.getElementById('flows');
for(let i=0;i<6;i++){
  const a=nodes[i],b=nodes[(i+1)%6];
  const mid=(-90+60*i+30)*Math.PI/180;
  const ctrl={x:CX+R*1.1*Math.cos(mid),y:CY+R*1.1*Math.sin(mid)};
  const p1=rectEdge(a,ctrl,123,65),p2=rectEdge(b,ctrl,125,67);
  const gold=(i===5);
  const path=$('path',{d:`M ${p1.x.toFixed(1)},${p1.y.toFixed(1)} Q ${ctrl.x.toFixed(1)},${ctrl.y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`,
    fill:'none',stroke:gold?'#ffd166':'url(#arcG)','stroke-width':gold?2.2:2,
    'marker-end':gold?'url(#ah-gold)':'url(#ah-cyan)',class:'flow rise',style:`--d:${.28+i*.06}s`,
    filter:gold?'drop-shadow(0 0 6px rgba(255,209,102,.45))':'drop-shadow(0 0 5px rgba(59,224,255,.4))'},FLOWS);
}
txt(FLOWS,645,250,'接受 → 重基线 / 回滚 → 丢弃编辑','alab','end');

const NG=document.getElementById('nodesG');
nodes.forEach((n,i)=>{
  const grp=$('g',{class:'node rise',style:`--d:${.08+i*.07}s`,transform:`translate(${n.x-116},${n.y-58})`},NG);
  $('rect',{class:'cardbox',x:0,y:0,width:232,height:116,rx:14,fill:'url(#cardG)',stroke:C.line,'stroke-width':1.3},grp);
  $('rect',{x:0,y:16,width:3.5,height:84,rx:2,fill:n.cc,opacity:.85},grp);
  $('rect',{x:14,y:13,width:38,height:22,rx:11,fill:'rgba(59,224,255,.09)',stroke:'rgba(59,224,255,.4)'},grp);
  txt(grp,33,28.5,n.no,'nno','middle');
  txt(grp,62,30,n.title,'nt');
  const chipW=tw(n.chip,9)+18;
  $('rect',{x:218-chipW,y:15,width:chipW,height:18,rx:9,fill:'rgba(255,255,255,.03)',stroke:n.cc,'stroke-opacity':'.35'},grp);
  txt(grp,218-chipW/2,27.5,n.chip,'chip','middle').setAttribute('fill',n.cc);
  const ys=n.dense?[47,62,77,92]:[50,67,84], cls=n.dense?'nd4':'nd';
  n.lines.forEach((ln,j)=>{
    txt(grp,18,ys[j],'▸','bul');
    txt(grp,29,ys[j],ln,cls);
  });
  txt(grp,16,107,n.path,'np');
});

const PANELS=document.getElementById('panels');
function panel(cfg){
  const P=$('g',{class:'rise',style:`--d:${cfg.d}s`},PANELS);
  $('rect',{x:cfg.x,y:140,width:280,height:600,rx:16,fill:'rgba(10,19,42,.72)',stroke:cfg.c,'stroke-opacity':'.22'},P);
  $('rect',{x:cfg.x,y:152,width:3,height:576,rx:1.5,fill:cfg.c,opacity:.7},P);
  txt(P,cfg.x+22,172,cfg.name,'pt').setAttribute('fill',cfg.c);
  txt(P,cfg.x+22+tw(cfg.name,16)+12,171,cfg.en,'psm');
  $('line',{x1:cfg.x+20,y1:186,x2:cfg.x+260,y2:186,stroke:cfg.c,'stroke-opacity':'.18'},P);
  cfg.steps.forEach((s,i)=>{
    const y=202+i*108;
    $('rect',{x:cfg.x+14,y,width:252,height:100,rx:10,fill:'rgba(13,22,46,.75)',stroke:'#223257'},P);
    $('circle',{cx:cfg.x+38,cy:y+26,r:13,fill:'rgba(255,255,255,.03)',stroke:cfg.c,'stroke-opacity':'.55'},P);
    txt(P,cfg.x+38,y+30.5,String(i+1),'mono','middle').setAttribute('fill',cfg.c);
    $('text',{x:cfg.x+60,y:y+30,class:'pstep'},P).textContent=s[0];
    txt(P,cfg.x+38,y+55,s[1][0],'pdesc');
    txt(P,cfg.x+38,y+72,s[1][1],'pdesc');
  });
  $('rect',{x:cfg.x+14,y:526,width:252,height:146,rx:10,fill:'rgba(13,22,46,.55)',stroke:cfg.c,'stroke-opacity':'.28','stroke-dasharray':'5 4'},P);
  txt(P,cfg.x+30,y2(526+24),cfg.extra.title,'','').setAttribute('style','font-size:11.5px;font-weight:700;fill:#dfe9fb');
  cfg.extra.render(P,cfg.x+14);
  txt(P,cfg.x+22,706,'▸ '+cfg.note,'pnote').setAttribute('fill',cfg.c);
  return P;
}
const y2=v=>v;
const LP=panel({x:40,name:'止血腿',en:'HEMOSTASIS · 修已然失败',c:C.amber,d:'.16s',
  steps:[['失败信号 · rep-gate',['≥2 reps 同向才 confirmed','单次失败挂「待复现」不进归因']],
         ['五桶消去归因',['断点四层:规划/检索/综合/输出','桶①②假梯度 → 滤除']],
         ['修现有规则 · E-id',['桶③出口:改措辞 / 词表','覆盖「点到没做实」的失败']]],
  extra:{title:'2×2 象限 · 遵从 × 结果',render:(P,x)=>{
    const cells=[[12,'遵从 · 好','rgba(59,224,255,.07)','rgba(59,224,255,.35)','#bfe9f7'],
                 [130,'违反 · 好 ★','rgba(255,209,102,.1)','rgba(255,209,102,.5)','#ffe3a3'],
                 [12,'遵从 · 差','rgba(91,109,149,.08)','rgba(91,109,149,.4)','#8ea3c8'],
                 [130,'违反 · 差','rgba(255,115,143,.07)','rgba(255,115,143,.35)','#f3c3cd']];
    cells.forEach((c2,i)=>{
      const cx=x+c2[0],cy=548+(i>1?38:0);
