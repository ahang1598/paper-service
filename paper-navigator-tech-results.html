<!DOCTYPE html>

<style>
  :root{
    --bg:#0a0f18; --sheet:#0f1826;
    --gold:#f0b45c; --teal:#2dd4bf; --cyan:#6fc3ff;
    --slate:#a3b6cc; --coral:#e8836e;
    --ink:#eef3fa; --sub:#94a5ba; --faint:#71839d; --line:#263447;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);
    background-image:radial-gradient(ellipse 80% 60% at 50% -10%, #121c2c 0%, transparent 60%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:26px 20px 18px; font-family:'Noto Sans SC',sans-serif;
  }
  .sheet{
    width:100%; max-width:1280px; border:1px solid #1d2938; border-radius:12px;
    overflow:hidden; background:var(--sheet);
    box-shadow:0 48px 90px -36px rgba(0,0,0,.75), 0 0 0 1px rgba(240,180,92,.04);
  }
  svg{display:block;width:100%;height:auto}
  .caption{
    margin-top:14px; font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;
    font-size:12px; letter-spacing:.14em; color:#5a6c84; text-align:center;
  }
  .t-cn{font-family:'Noto Sans SC',sans-serif}
  .t-mono{font-family:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace}

  .band{opacity:0; transform:translateY(12px); animation:rise .7s cubic-bezier(.16,.8,.3,1) forwards}
  .d0{animation-delay:.02s}.d1{animation-delay:.12s}.d2{animation-delay:.22s}
  .d3{animation-delay:.32s}.d4{animation-delay:.42s}
  @keyframes rise{to{opacity:1; transform:none}}
  .flow{stroke-dasharray:8 8; animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-16}}
  .node .box{transition:stroke-width .25s ease, filter .25s ease}
  .node:hover .box{stroke-width:2.5; filter:drop-shadow(0 0 9px rgba(240,180,92,.35))}
  @media print{
    body{background:none;padding:0}
    .sheet{border:none;box-shadow:none;border-radius:0}
    .caption{display:none}
    .band{animation:none;opacity:1;transform:none}
  }
</style>
</head>
